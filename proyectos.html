<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROYECTOS | Rubén Alarcón</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-view">

    <nav class="nav-minimal">
        <a href="index.html">← VOLVER</a>
        <span>PORTAFOLIO VISUAL</span>
    </nav>

    <div class="visual-grid">
        <div class="grid-item" onclick="openFull(this)"><img src="img/001.png" alt="Diseño 001"></div>
        <div class="grid-item" onclick="openFull(this)"><img src="img/002.png" alt="Diseño 002"></div>
        <div class="grid-item" onclick="openFull(this)"><img src="img/003.png" alt="Diseño 003"></div>
        <div class="grid-item" onclick="openFull(this)"><img src="img/004.png" alt="Diseño 004"></div>
        </div>

    <div id="viewer" onclick="this.style.display='none'">
        <img id="full-img">
    </div>

    <script>
        function openFull(el) {
            const fullImg = document.getElementById('full-img');
            fullImg.src = el.querySelector('img').src;
            document.getElementById('viewer').style.display = 'flex';
        }
    </script>
</body>
</html>
