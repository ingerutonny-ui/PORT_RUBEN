<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROYECTOS | Lic. Alarcón</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* ============================================================
           DISEÑO DE GALERÍA DE PROYECTOS DINÁMICA (EFECTO LIGHTBOX)
           ============================================================ */
        body.gallery-view {
            background-color: #020202;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* 1. Visor Principal (Donde aparece la imagen grande) */
        .viewer-container {
            width: 100%;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(10,10,10,0.9) 100%);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        .active-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            box-shadow: 0 0 50px rgba(255,255,255,0.05);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            filter: brightness(0.9); /* Sutil para no quemar la vista */
        }

        /* Leyenda de la Imagen Principal (Visor) */
        .viewer-caption {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: #fff;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 2. Mesa de Luz / Miniaturas (Donde haces clic) */
        .thumbnails-container {
            width: 100%;
            padding: 20px;
            background: rgba(10,10,10,0.95);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: center;
            gap: 15px;
            overflow-x: auto;
        }

        .thumb {
            width: 100px;
            height: 70px;
            flex-shrink: 0;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.4s ease;
            position: relative;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.5);
            transition: all 0.4s ease;
        }

        /* Efecto al pasar el mouse sobre la miniatura */
        .thumb:hover img {
            filter: grayscale(0%) brightness(0.8);
        }

        /* Efecto cuando la miniatura es la activa (borde y color) */
        .thumb.active-thumb {
            border-color: rgba(99, 102, 241, 0.6);
            transform: translateY(-5px);
        }

        .thumb.active-thumb img {
            filter: grayscale(0%) brightness(1);
        }

        /* Navegación Minimalista */
        .nav-minimal {
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-minimal a {
            color: #fff;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 25px;
            border-radius: 50px;
            transition: 0.4s;
        }

        .nav-minimal a:hover {
            background: #fff;
            color: #000;
        }

        .nav-minimal span {
            color: rgba(255,255,255,0.4);
            font-size: 0.7rem;
            letter-spacing: 5px;
        }

        /* Footer */
        .gallery-footer {
            padding: 30px 60px;
            text-align: center;
        }

        .gallery-footer p {
            color: #444;
            font-size: 0.7rem;
            letter-spacing: 7px;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="gallery-view">

    <nav class="nav-minimal">
        <a href="index.html">← VOLVER</a>
        <span>PORTAFOLIO VISUAL</span>
    </nav>

    <div class="viewer-container">
        <img src="img/001.png" alt="Visor Principal" id="viewerImage" class="active-img">
        <p class="viewer-caption" id="viewerCaption">PROYECTO 1 | IDENTIDAD VISUAL</p>
    </div>

    <div class="thumbnails-container">
        <div class="thumb active-thumb" onclick="activateViewer(0, 'img/001.png', 'PROYECTO 1 | IDENTIDAD VISUAL')">
            <img src="img/001.png" alt="Thumbnail 1">
        </div>
        <div class="thumb" onclick="activateViewer(1, 'img/002.png', 'PROYECTO 2 | DISEÑO EDITORIAL')">
            <img src="img/002.png" alt="Thumbnail 2">
        </div>
        <div class="thumb" onclick="activateViewer(2, 'img/003.png', 'PROYECTO 3 | PUBLICIDAD DIGITAL')">
            <img src="img/003.png" alt="Thumbnail 3">
        </div>
        <div class="thumb" onclick="activateViewer(3, 'img/004.jpg', 'PROYECTO 4 | ESTRATEGIA DIGITAL')">
            <img src="img/004.jpg" alt="Thumbnail 4">
        </div>
        <div class="thumb" onclick="activateViewer(4, 'img/005.png', 'PROYECTO 5 | BRANDING AVANZADO')">
            <img src="img/005.png" alt="Thumbnail 5">
        </div>
    </div>

    <div class="gallery-footer">
        <p>HAZ CLIC EN UN CUADRO PARA EXPLORAR 15 AÑOS DE ARTE GRÁFICO</p>
    </div>

    <script>
        function activateViewer(index, imgSrc, captionText) {
            // 1. Obtenemos los elementos principales
            const viewerImg = document.getElementById('viewerImage');
            const viewerCaption = document.getElementById('viewerCaption');
            const thumbnails = document.querySelectorAll('.thumb');

            // 2. Transición suave de la imagen principal
            viewerImg.style.opacity = '0'; // Se desvanece
            
            // 3. Pequeño retraso para la coreografía visual
            setTimeout(() => {
                viewerImg.src = imgSrc; // Cambiamos la imagen
                viewerCaption.innerText = captionText; // Cambiamos la leyenda
                
                // 4. Actualizamos el estado de las miniaturas
                thumbnails.forEach(thumb => thumb.classList.remove('active-thumb')); // Limpiamos todos
                thumbnails[index].classList.add('active-thumb'); // Activamos el que se hizo clic
                
                viewerImg.style.opacity = '1'; // Reaparece
            }, 300); // Retraso suave para el efecto
        }
    </script>

</body>
</html>
