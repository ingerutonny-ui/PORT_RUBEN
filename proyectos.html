<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROYECTOS | Lic. Alarcón</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        body.gallery-view {
            background-color: #050505;
            color: #fff;
            min-height: 100vh;
        }

        .nav-minimal {
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(5,5,5,0.9);
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-minimal a {
            color: #fff;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 30px;
            border-radius: 50px;
            transition: 0.4s;
        }

        .nav-minimal a:hover { background: #fff; color: #000; }

        /* ============================================================
           ESTILO MASONRY (ALBAÑILERÍA) PARA +50 IMÁGENES
           ============================================================ */
        .masonry-container {
            column-count: 4; /* 4 columnas para escritorio */
            column-gap: 15px;
            padding: 0 40px 100px 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .masonry-item {
            display: inline-block;
            width: 100%;
            margin-bottom: 15px;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            background: #111;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .masonry-item img {
            width: 100%;
            display: block;
            filter: grayscale(100%) brightness(0.7);
            transition: all 0.6s ease;
        }

        /* EFECTO AL PASAR EL MOUSE */
        .masonry-item:hover {
            transform: translateY(-8px);
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .masonry-item:hover img {
            filter: grayscale(0%) brightness(1);
            transform: scale(1.05);
        }

        /* Overlay con Info */
        .item-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            opacity: 0;
            transition: 0.4s;
        }

        .masonry-item:hover .item-info { opacity: 1; }

        .item-info span {
            font-size: 0.65rem;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* RESPONSIVO */
        @media (max-width: 1200px) { .masonry-container { column-count: 3; } }
        @media (max-width: 800px) { .masonry-container { column-count: 2; } }
        @media (max-width: 500px) { .masonry-container { column-count: 1; } }

        .footer-text {
            text-align: center;
            padding: 50px;
            color: #444;
            letter-spacing: 5px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="gallery-view">

    <nav class="nav-minimal">
        <a href="index.html">← INICIO</a>
        <div style="letter-spacing: 5px; font-size: 0.7rem; color: #666;">15 AÑOS DE EXPERIENCIA</div>
    </nav>

    <div class="masonry-container">
        <div class="masonry-item">
            <img src="img/001.png" alt="Diseño 1">
            <div class="item-info"><span>ARTE GRÁFICO 01</span></div>
        </div>
        <div class="masonry-item">
            <img src="img/002.png" alt="Diseño 2">
            <div class="item-info"><span>ESTRATEGIA DIGITAL</span></div>
        </div>
        <div class="masonry-item">
            <img src="img/003.png" alt="Diseño 3">
            <div class="item-info"><span>IDENTIDAD VISUAL</span></div>
        </div>
        <div class="masonry-item">
            <img src="img/004.jpg" alt="Diseño 4">
            <div class="item-info"><span>DISEÑO PREMIUM</span></div>
        </div>
        <div class="masonry-item">
            <img src="img/005.png" alt="Diseño 5">
            <div class="item-info"><span>PORTAFOLIO 2026</span></div>
        </div>
        </div>

    <p class="footer-text">Explora la trayectoria completa del Lic. Alarcón</p>

</body>
</html>
